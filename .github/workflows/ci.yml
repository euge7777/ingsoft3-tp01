
name: CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Mostrar rama y commit
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Descargar codigo del repositorio
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Ejecutar tests y coverage del backend
        uses: docker/build-push-action@v7
        with:
          context: ./server
          target: test-report
          push: false
          tags: backend-tests:ci
          outputs: type=local,dest=./backend-test-report
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publicar resumen backend
        run: |
          echo "## Backend tests y coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Los tests del backend se ejecutaron dentro del Dockerfile." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- JaCoCo check ejecutado" >> $GITHUB_STEP_SUMMARY
          echo "- Reporte HTML generado" >> $GITHUB_STEP_SUMMARY
          echo "- Reporte disponible como artifact" >> $GITHUB_STEP_SUMMARY

      - name: Subir reporte backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend-test-report/

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/euge7777/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Mostrar rama y commit
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Descargar codigo del repositorio
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Ejecutar tests y coverage del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./client
          target: test-report
          push: false
          tags: frontend-tests:ci
          outputs: type=local,dest=./frontend-test-report
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Publicar resumen frontend
        run: |
          echo "## Frontend tests y coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Los tests del frontend se ejecutaron dentro del Dockerfile." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Vitest ejecutado" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage con V8 ejecutado" >> $GITHUB_STEP_SUMMARY
          echo "- Umbral de coverage aplicado" >> $GITHUB_STEP_SUMMARY
          echo "- Reporte disponible como artifact" >> $GITHUB_STEP_SUMMARY

      - name: Subir reporte frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-coverage
          path: frontend-test-report/

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./client
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/euge7777/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          build-args: |
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: qa

    steps:

      - name: Desplegar imagenes en QA
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/euge7777/ingsoft3-tp01-backend:sha-${GITHUB_SHA}"
          IMG_FRONT="ghcr.io/euge7777/ingsoft3-tp01-frontend:sha-${GITHUB_SHA}"

          curl -fsS --max-time 30 --get \
            --data-urlencode "imgURL=$IMG_API" \
            "$HOOK_API"

          curl -fsS --max-time 30 --get \
            --data-urlencode "imgURL=$IMG_FRONT" \
            "$HOOK_FRONT"

      - name: Smoke test QA
        shell: bash
        env:
          URL_API: https://expense-api-qa.onrender.com
          URL_FRONT: https://expense-fornt-qa.onrender.com
        run: |
          echo "Esperando a que QA este disponible..."

          for i in $(seq 1 30); do
            echo "Intento $i de 30..."

            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/v1/health/db" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "QA responde correctamente: API + BD + frontend"
              exit 0
            fi

            sleep 20
          done

          echo "QA no respondio a tiempo"
          exit 1

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:

      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        working-directory: ./client
        run: npm ci

      - name: Ejecutar pruebas de integracion
        working-directory: ./client
        env:
          API_BASE_URL: https://expense-api-qa.onrender.com
          API_TEST_EMAIL: ${{ secrets.API_TEST_EMAIL }}
          API_TEST_PASSWORD: ${{ secrets.API_TEST_PASSWORD }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/integracion
        run: |
          npx playwright test e2e/api.spec.ts --workers=1

      - name: Publicar reporte de integracion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integracion
          path: |
            client/playwright-report/
            client/test-results/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    needs: integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:

      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        working-directory: ./client
        run: npm ci

      - name: Instalar Chromium
        working-directory: ./client
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        working-directory: ./client
        env:
          API_BASE_URL: https://expense-api-qa.onrender.com
          E2E_BASE_URL: https://expense-fornt-qa.onrender.com
          API_TEST_EMAIL: ${{ secrets.API_TEST_EMAIL }}
          API_TEST_PASSWORD: ${{ secrets.API_TEST_PASSWORD }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/e2e
        run: |
          npx playwright test e2e/expense.spec.ts --workers=1

      - name: Publicar reporte E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: |
            client/playwright-report/
            client/test-results/
          if-no-files-found: warn
          retention-days: 14

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:

      - name: Desplegar imagenes en PROD
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/euge7777/ingsoft3-tp01-backend:sha-${GITHUB_SHA}"
          IMG_FRONT="ghcr.io/euge7777/ingsoft3-tp01-frontend:sha-${GITHUB_SHA}"

          curl -fsS --max-time 30 --get \
            --data-urlencode "imgURL=$IMG_API" \
            "$HOOK_API"

          curl -fsS --max-time 30 --get \
            --data-urlencode "imgURL=$IMG_FRONT" \
            "$HOOK_FRONT"

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: https://expense-api-prod.onrender.com
          URL_FRONT: https://expense-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD este disponible..."

          for i in $(seq 1 30); do
            echo "Intento $i de 30..."

            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/v1/health/db" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "PROD responde correctamente: API + BD + frontend"
              exit 0
            fi

            sleep 20
          done

          echo "PROD no respondio a tiempo"
          exit 1
